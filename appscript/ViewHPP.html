<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FFF5F0;
            padding: 20px;
            color: #333;
            margin: 0;
        }

        #konten-laporan {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .header {
            background-color: #FF7F50;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        h2,
        h3,
        h4 {
            margin: 0;
            padding-bottom: 5px;
        }

        .info-tamu {
            background: #FFFFFF;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #FF7F50;
            border-right: 1px solid #FFE4D6;
            border-top: 1px solid #FFE4D6;
            border-bottom: 1px solid #FFE4D6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            background: white;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #FFE4D6;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #FFE4D6;
            color: #D35400;
            font-weight: 600;
            text-align: center;
            font-size: 14px;
        }

        .footer-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #FF7F50;
        }

        .total-hpp {
            font-size: 20px;
            font-weight: 600;
            color: #D35400;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-pdf {
            background-color: #E67E22;
            color: white;
        }

        .btn-pdf:hover {
            background-color: #D35400;
        }

        .btn-tutup {
            background-color: #95A5A6;
            color: white;
        }

        .btn-tutup:hover {
            background-color: #7F8C8D;
        }

        .text-center {
            text-align: center;
        }

        .text-right {
            text-align: right;
        }

        .badge {
            background: #FF7F50;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            vertical-align: top;
            margin-left: 10px;
        }

        .catatan-text {
            font-size: 12px;
            color: #7f8c8d;
            font-style: italic;
        }

        /* =========================================
       PENGATURAN KHUSUS UNTUK CETAK/DOWNLOAD PDF
       ========================================= */
        @media print {

            /* Sembunyikan tombol saat di-PDF-kan */
            .action-buttons {
                display: none !important;
            }

            /* Reset background agar bersih di kertas */
            body {
                background-color: white !important;
                padding: 0 !important;
            }

            #konten-laporan {
                box-shadow: none !important;
                padding: 0 !important;
            }

            /* Paksa browser mencetak warna background elemen (Penting!) */
            * {
                -webkit-print-color-adjust: exact !important;
                color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            /* Cegah baris tabel terbelah di tengah halaman */
            tr {
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <div id="konten-laporan">
        <div class="header">
            <h2>🔍 LAPORAN RINCIAN HPP</h2>
        </div>

        <div class="info-tamu">
            <h3 id="teksNamaTamu">Memuat Data... ⏳</h3>
            <p style="margin: 5px 0; color: #D35400; font-size: 13px; font-weight: 500;">Mahkota Gandrung Organizer -
                Banyuwangi</p>
        </div>

        <table id="tabelHPP">
            <thead>
                <tr>
                    <th width="5%">No</th>
                    <th width="20%">Kategori</th>
                    <th width="25%">Vendor / Item</th>
                    <th width="25%">Nominal (Rp)</th>
                    <th width="25%">Catatan</th>
                </tr>
            </thead>
            <tbody id="bodyHPP">
                <!-- Data disuntikkan dari script -->
            </tbody>
        </table>

        <div class="footer-total">
            <div class="total-hpp">TOTAL HPP: Rp <span id="labelTotal">0</span></div>
        </div>
    </div>

    <!-- Area Tombol -->
    <div class="action-buttons">
        <button class="btn btn-pdf" onclick="downloadPDF()">📥 CETAK / SAVE PDF</button>
        <button class="btn btn-tutup" onclick="google.script.host.close()">TUTUP</button>
    </div>

    <script>
        var currentKode = "";

        window.onload = function () {
            google.script.run.withSuccessHandler(tampilkanData).getHPPReadOnly();
        }

        function tampilkanData(data) {
            if (data.error) {
                document.getElementById('teksNamaTamu').innerText = "⚠️ " + data.error;
                return;
            }

            currentKode = data.kode;
            document.title = "HPP_" + currentKode; // Setup nama file otomatis
            document.getElementById('teksNamaTamu').innerHTML = data.kode + " | " + data.nama + " <span class='badge'>Read Only</span>";

            let tbody = document.getElementById('bodyHPP');
            tbody.innerHTML = '';

            if (data.rincian.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="color:#999; padding: 20px;">Belum ada pengeluaran HPP tercatat.</td></tr>';
            } else {
                data.rincian.forEach(function (item, index) {
                    let tr = document.createElement('tr');
                    let formatNominal = item.nominal.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
                    let tampilCatatan = item.catatan ? item.catatan : '-';

                    tr.innerHTML = `
            <td class="text-center">${index + 1}</td>
            <td style="color:#D35400;"><strong>${item.kategori}</strong></td>
            <td>${item.vendor}</td>
            <td class="text-right">${formatNominal}</td>
            <td class="catatan-text">${tampilCatatan}</td>
          `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('labelTotal').innerText = data.total.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function downloadPDF() {
            // Memanggil fungsi print bawaan browser
            window.print();
        }
    </script>
</body>

</html>
